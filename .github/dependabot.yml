version: 2

updates:
  # Runtime + dev Python dependencies. Both requirements files are pinned to
  # exact versions, so nothing updates without a PR that CI runs against.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: development
    labels: ["dependencies", "python"]
    groups:
      # One PR for routine bumps keeps the queue small; security fixes are
      # still raised individually and immediately, outside this schedule.
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    target-branch: development
    labels: ["dependencies", "javascript"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Actions are pinned by major tag (@v4), which silently absorbs upstream
  # changes. Dependabot at least surfaces when a new major is available.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: development
    labels: ["dependencies", "ci"]
