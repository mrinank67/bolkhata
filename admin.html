<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>BolKhata Support</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!--
      No manifest and no service-worker registration: this is a support console,
      not an installable app, and nothing about another shop's data should be
      cached on the operator's device. sw.js (scope "/") also skips /admin
      explicitly, because the worker registered by index.html controls this page
      whether or not this page asked for it.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("bk-theme") || "dark";
          document.documentElement.setAttribute("data-theme", t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "light" ? "#f4f4f7" : "#0a0a0f");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body class="admin-body">

    <!-- ═══════════ SIGN IN ═══════════ -->
    <div id="admin-login" class="card admin-login">
      <button id="theme-toggle-login" class="theme-toggle theme-toggle-login" type="button" aria-label="Toggle light/dark mode" title="Switch theme">
        <span class="theme-toggle-icon">🌙</span>
      </button>
      <div class="brand">
        <div class="brand-icon">🛠️</div>
        <div class="brand-name">Support</div>
      </div>
      <p class="brand-sub">BolKhata operations console</p>

      <div id="admin-login-error" class="error-msg"></div>

      <!--
        Markup mirrors the login card in index.html on purpose: .field-group /
        .field-label / .btn.btn-accent are what styles.css actually defines.
        `.btn` is a *base* class — a variant alone (.btn-accent) inherits no
        padding, radius or colour and renders as a raw browser button.
      -->
      <div class="field-group">
        <label class="field-label" for="admin-email">Email</label>
        <input id="admin-email" type="email" placeholder="you@email.com" autocomplete="username" />
      </div>
      <div class="field-group">
        <label class="field-label" for="admin-password">Password</label>
        <input id="admin-password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button id="admin-signin-btn" class="btn btn-accent" type="button">Sign In</button>

      <!--
        The same Google provider the shopkeeper's app offers. Without it an
        operator whose account was created through Google has no way in at all,
        since a Google account has no password to type above.
      -->
      <div class="divider"><span>or</span></div>

      <button id="admin-google-btn" class="btn btn-outline" type="button">
        <svg class="btn-icon-google" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- ═══════════ DENIED ═══════════ -->
    <div id="admin-denied" class="card admin-login hidden">
      <div class="brand">
        <div class="brand-icon">🔒</div>
        <div class="brand-name">No access</div>
      </div>
      <p class="brand-sub">
        This account does not have support access.<br />
        Ask an administrator to grant it.
      </p>
      <button id="admin-denied-signout" class="btn btn-outline" type="button">Sign out</button>
    </div>

    <!-- ═══════════ CONSOLE ═══════════ -->
    <div id="admin-app" class="admin-shell hidden">
      <header class="admin-topbar">
        <div class="admin-brand">
          <span class="admin-brand-icon">🛠️</span>
          <span class="admin-brand-name">BolKhata Support</span>
        </div>
        <div class="admin-search">
          <input id="admin-search-input" type="search" placeholder="Phone, email, or uid…" autocomplete="off" />
          <button id="admin-search-btn" class="btn-small" type="button">Find shop</button>
        </div>
        <div class="admin-topbar-right">
          <button id="theme-toggle-app" class="theme-toggle" type="button" aria-label="Toggle light/dark mode" title="Switch theme">
            <span class="theme-toggle-icon">🌙</span>
          </button>
          <span id="admin-whoami" class="admin-whoami"></span>
          <button id="admin-signout" class="btn-small btn-danger-ghost" type="button">Sign out</button>
        </div>
      </header>

      <!-- Shop picker: results of a search, or recent signups -->
      <section id="admin-results" class="admin-results"></section>

      <!-- The shop currently being supported -->
      <section id="admin-shop" class="admin-shop hidden">
        <div id="admin-shop-header" class="admin-shop-header"></div>

        <nav class="admin-tabs" id="admin-tabs">
          <button class="admin-tab active" data-tab="voice" type="button">🎙️ Voice log</button>
          <button class="admin-tab" data-tab="orders" type="button">📋 Orders</button>
          <button class="admin-tab" data-tab="ledger" type="button">📒 Ledger</button>
          <button class="admin-tab" data-tab="suppliers" type="button">🚚 Suppliers</button>
          <button class="admin-tab" data-tab="inventory" type="button">📦 Inventory</button>
          <button class="admin-tab" data-tab="bills" type="button">🧾 Bills</button>
          <button class="admin-tab" data-tab="settings" type="button">⚙️ Settings</button>
        </nav>

        <div id="admin-panel-voice" class="admin-panel">
          <div class="admin-panel-bar">
            <select id="admin-voice-status">
              <option value="">All outcomes</option>
              <option value="ok">Succeeded</option>
              <option value="stt_empty">Heard nothing</option>
              <option value="stt_error">STT failed</option>
              <option value="llm_error">Intent failed</option>
              <option value="rate_limited">Rate limited</option>
              <option value="audio_too_short">Audio too short</option>
              <option value="audio_too_long">Audio too long</option>
              <option value="resolve">Disambiguation</option>
            </select>
            <button id="admin-voice-refresh" class="btn-small" type="button">Refresh</button>
          </div>
          <div id="admin-voice-list" class="admin-list"></div>
        </div>

        <div id="admin-panel-orders" class="admin-panel hidden"></div>
        <div id="admin-panel-ledger" class="admin-panel hidden"></div>
        <div id="admin-panel-suppliers" class="admin-panel hidden"></div>
        <div id="admin-panel-inventory" class="admin-panel hidden"></div>
        <div id="admin-panel-bills" class="admin-panel hidden"></div>
        <div id="admin-panel-settings" class="admin-panel hidden"></div>
      </section>

      <div id="admin-audit-drawer" class="admin-audit hidden">
        <div class="admin-audit-head">
          <strong>Recent support actions</strong>
          <button id="admin-audit-close" class="btn-small" type="button">Close</button>
        </div>
        <div id="admin-audit-list" class="admin-list"></div>
      </div>

      <button id="admin-audit-open" class="admin-audit-fab" type="button" title="Audit trail">📜</button>
    </div>

    <div id="admin-toast" class="admin-toast"></div>

    <script type="module" src="/js/admin/main.js"></script>
  </body>
</html>
