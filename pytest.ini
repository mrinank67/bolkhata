[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers --strict-config
filterwarnings =
    # Surface DeprecationWarnings from our own code, but don't fail the run on
    # warnings raised inside firebase-admin / grpc / pydantic internals.
    default
markers =
    slow: tests that take noticeably longer (PDF rendering, image encoding)
    allow_network: opt out of the autouse network guard in conftest.py
